name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-website:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/devops-website:latest \
            .

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-website:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-website:latest

      - name: Tag for MicroK8s registry
        run: |
          docker tag \
            ${{ secrets.DOCKERHUB_USERNAME }}/devops-website:${{ github.sha }} \
            localhost:32000/devops-website:${{ github.sha }}

      - name: Push to MicroK8s registry
        run: |
          docker push localhost:32000/devops-website:${{ github.sha }}

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/devops-website \
            devops-website=localhost:32000/devops-website:${{ github.sha }}

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/devops-website --timeout=120s

      - name: Verify
        run: |
          kubectl get pods
          kubectl get deployment devops-website
